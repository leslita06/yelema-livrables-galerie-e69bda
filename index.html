<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livrables, proposition v2</title>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--b:#E60949;--b-ink:#B8073A;--tint:#FDE8EE;--ink:#1B1530;--ink2:#4A4660;--ink3:#7A778C;--line:#ECEAF2;--soft:#F5F4F9;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:20px;height:20px;display:inline-block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:22px 32px 80px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:14px;font-weight:500;min-height:36px}
.hd{display:flex;align-items:center;gap:12px;margin-top:8px}
h1{font-family:"Funnel Display",Inter,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.02em;flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--soft)}
/* onglets */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin-top:18px;width:max-content}
.seg button{height:38px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink3)}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,21,48,.08)}
.seg small{font-weight:500;color:var(--ink3);margin-left:4px}
/* Experts */
.who{display:flex;gap:14px;margin-top:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;flex:none;font-size:12px;font-weight:500;color:var(--ink2)}
.who .ph{width:52px;height:52px;border-radius:50%;padding:2px;border:2px solid transparent}
.who .ph>img,.who .ph>span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.who button[aria-pressed=true] .ph{border-color:var(--b)}
.who button[aria-pressed=true]{color:var(--ink);font-weight:600}
/* groupes */
.grp{margin-top:26px}
.grp h2{font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.t{position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;background:var(--soft);display:block;width:100%;text-align:left}
.t .art{position:absolute;inset:0}
.t .ov{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.t .meta{position:absolute;left:8px;bottom:7px;display:flex;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:600}
.t .meta .i{width:15px;height:15px}
.t .play{position:absolute;left:50%;top:46%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff}
.t .play .i{width:18px;height:18px}
.t .by{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;object-fit:cover}
.t .nw{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--b);border:2px solid #fff}
.t .busy{position:absolute;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--b);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
/* vignettes dessinées */
.a-promo{background:var(--b);color:#fff;padding:12%;display:flex;flex-direction:column;justify-content:space-between}
.a-promo b{font-family:"Funnel Display";font-size:clamp(18px,2.6vw,34px);line-height:.95;position:relative;z-index:1}
.a-promo small{font-size:clamp(9px,1vw,12px);font-weight:600;opacity:.9}
.a-promo .bag{position:absolute;right:9%;top:9%;width:26%;aspect-ratio:3/4;background:#fff;border-radius:6px 6px 10px 10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.a-promo .bag:after{content:"";position:absolute;left:15%;right:15%;top:30%;height:28%;background:#F7C948;border-radius:4px}
.a-vid{background:radial-gradient(circle at 30% 30%,#8a6a4a,#2b1d14)}
.a-vid:before{content:"";position:absolute;left:12%;right:12%;bottom:22%;height:30%;background:repeating-linear-gradient(90deg,#c9a77a 0 14%,#a7835a 14% 18%);opacity:.7;border-radius:4px}
.a-vid2{background:linear-gradient(160deg,#f2d6c4,#c98b6b)}
.a-vid2:before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,#7d4a33)}
.a-cream{background:#FFF4E2;padding:12%;color:#7a3b12}
.a-cream b{font-family:"Funnel Display";font-size:clamp(12px,1.6vw,20px);line-height:1}
.a-cream .bowl{position:absolute;left:22%;right:22%;bottom:10%;height:28%;background:#fff;border-radius:0 0 999px 999px;box-shadow:inset 0 10px 0 #f3e3c6}
.a-cream .bowl:before{content:"";position:absolute;left:12%;right:12%;top:-12%;height:40%;border-radius:50%;background:radial-gradient(circle,#fbfbf6 40%,#e9dfc8)}
.a-slide{background:#fff;padding:10%;border:1px solid var(--line)}
.a-slide b{display:block;font-size:clamp(10px,1.2vw,14px);color:var(--ink);line-height:1.1}
.a-slide i{display:block;width:30%;height:4px;background:var(--b);margin:6px 0 10px;border-radius:2px}
.a-slide .bars{position:absolute;left:10%;right:10%;bottom:14%;height:46%;display:flex;align-items:flex-end;gap:7%}
.a-slide .bars span{flex:1;background:var(--b);border-radius:3px 3px 0 0;opacity:.85}
.a-slide .bars span:nth-child(odd){background:#F2A0B6}
.a-story{background:linear-gradient(180deg,#1E7A4B,#0F4A2C);color:#fff;padding:12%}
.a-story b{font-family:"Funnel Display";font-size:clamp(16px,2.6vw,30px);line-height:.95}
.a-story .sack{position:absolute;left:30%;right:30%;bottom:10%;height:44%;background:#F3EFE6;border-radius:8px 8px 14px 14px}
.a-story .sack:after{content:"5 kg";position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:700;color:#0F4A2C;font-size:clamp(10px,1.4vw,16px)}
.a-cal{background:#fff;padding:9%;border:1px solid var(--line)}
.a-cal b{font-size:clamp(9px,1.1vw,13px)}
.a-cal .d{position:absolute;left:9%;right:9%;bottom:9%;top:30%;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.a-cal .d span{background:var(--soft);border-radius:2px}
.a-cal .d span.on{background:var(--b)} .a-cal .d span.on2{background:#F7C948}
.a-org{background:#F6F2FF;padding:10%}
.a-org b{font-size:clamp(9px,1.1vw,13px);color:#3b2a7a}
.a-org .n{position:absolute;width:22%;height:12%;background:#fff;border:2px solid #8D68FA;border-radius:4px}
.a-li{background:#0A66C2;color:#fff;padding:12%}
.a-li b{font-family:"Funnel Display";font-size:clamp(14px,2.2vw,26px);line-height:1}
.a-li small{display:block;margin-top:6px;font-size:clamp(8px,1vw,12px);opacity:.85}
.a-pack{background:linear-gradient(135deg,#FCE3B0,#F3B95F)}
.a-pack:before{content:"";position:absolute;left:28%;right:28%;top:14%;bottom:12%;background:var(--b);border-radius:10px 10px 6px 6px;box-shadow:6px 8px 0 rgba(0,0,0,.08)}
.a-pack:after{content:"UNIFOOD";position:absolute;left:28%;right:28%;top:40%;text-align:center;color:#fff;font-weight:800;font-size:clamp(8px,1vw,12px);letter-spacing:.06em}
.a-line{background:#fff;border:1px solid var(--line);padding:10%}
.a-line b{font-size:clamp(9px,1.1vw,13px)}
.a-line svg{position:absolute;left:8%;right:8%;bottom:12%;width:84%;height:52%}
.a-aff{background:#2B1D52;color:#fff;padding:12%}
.a-aff b{font-family:"Funnel Display";font-size:clamp(14px,2.2vw,26px);line-height:1}

.wrap{max-width:1100px}
/* en-tête d'Expert, comme dans l'app */
.xh{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.xh img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.xh b{display:block;font-size:17px}
.xh small{font-size:13px;color:var(--ink3)}
.xt{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 -1px 0 var(--line)}
.xt span{padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.xt span.on{color:var(--b);box-shadow:inset 0 -2px 0 var(--b)}
/* barre d'outils */
.tb{display:flex;gap:8px;align-items:center;margin-top:16px}
.sf{flex:1;display:flex;align-items:center;gap:8px;height:44px;border-radius:999px;background:var(--soft);padding:0 14px;color:var(--ink3);font-size:14px;min-width:0}
.tg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.tg button{width:40px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--ink3)}
.tg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,21,48,.08)}
.sort{height:44px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.dd{white-space:nowrap;height:44px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dd .st{display:flex}.dd .st img{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;object-fit:cover}.dd .st img:first-child{margin-left:0}
/* projets */
.ph2{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px}
.ph2 h2{font-size:15px;font-weight:700}
.ph2 small{font-size:13px;color:var(--ink3)}
.pr{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.pr::-webkit-scrollbar{display:none}
.pc{flex:none;width:150px;text-align:left}
.pc .mo{display:block;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--soft);position:relative}
.pc .mo .t{border-radius:0}
.pc .mo .t{width:100%;height:100%}
.pc b{display:block;font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);margin-top:2px}
.pc small img{width:16px;height:16px;border-radius:50%;object-fit:cover}
.pc .nwb{position:absolute;top:6px;right:6px;background:var(--b);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
.bar2{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--soft)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.crumb{display:flex;align-items:center;gap:4px;margin-top:16px;font-size:15px}
.crumb button{color:var(--ink3);font-weight:500;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.crumb b{font-weight:700}
/* liste */
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;min-height:68px;box-shadow:inset 0 -1px 0 var(--line)}
.lrow .th{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none;position:relative;background:var(--soft)}
.lrow .th .t{border-radius:0}
.lrow .th .t .art *{font-size:6px!important}
.lrow .fo{width:48px;height:48px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--tint);color:var(--b-ink)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tx small{font-size:13px;color:var(--ink3)}
.list{border-radius:14px;background:#fff}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 4px;min-height:72px;box-shadow:inset 0 -1px 0 var(--line)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);margin-top:3px}
.row .tx small img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.pg{width:46px;height:58px;border-radius:6px;background:#fff;border:1px solid var(--line);position:relative;flex:none;overflow:hidden;padding:7px 6px}
.pg i{display:block;height:3px;border-radius:2px;background:#DAD8E3;margin-bottom:4px}
.pg i:first-child{width:70%;background:var(--ink2)}
.pg em{position:absolute;left:0;right:0;bottom:0;height:16px;font:700 9px/16px Inter;text-align:center;color:#fff;font-style:normal}
.f-pdf em{background:#E5484D}.f-doc em{background:#2E6BE6}.f-xls em{background:#1F9254}.f-gdoc em{background:#4285F4}
.lk{width:58px;height:58px;border-radius:10px;flex:none;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.lk img,.lk .i{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:10}
.menu{position:absolute;margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(27,21,48,.16);padding:6px;z-index:5;width:240px;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;font-size:14px;text-align:left}
.menu button:hover{background:var(--soft)}
.menu img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.menu small{display:block;font-size:12px;color:var(--ink3)}
@media (max-width:640px){
  .wrap{padding:10px 0 60px}
  .back,.hd,.grp h2{margin-left:16px;margin-right:16px}
  h1{font-size:26px}
  .grid{grid-template-columns:repeat(3,1fr);gap:2px}
  .grid .t{border-radius:0}
  .tb.tous .sf b{display:none}.tb.tous .sf{flex:none;width:44px;padding:0;justify-content:center}
  .ddw{flex:1;min-width:0}.tb .dd{width:100%}
  .dd span.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:left}
  .xh,.xt,.tb,.ph2,.pr,.bar2,.crumb,.lst{margin-left:16px;margin-right:16px}
  .xt{margin:0}
  .pr{margin-right:0;padding-right:16px}
  .pc{width:128px}
  .sort{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const IC = n => `<span class="i" style="--m:url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/${n}.svg)"></span>`;
const X = {fatima:"Fatima",koffi:"Koffi",kouassi:"Kouassi",djeneba:"Djénéba",mamadou:"Mamadou",adjoua:"Adjoua"};
const JOB = {fatima:"Marketing et contenu",koffi:"Design de marque",kouassi:"Commercial",djeneba:"Chief of Staff & Direction",mamadou:"Finance",adjoua:"Ressources humaines"};
const ph = x => `img/${x}.jpg`;
const ART = {
 promo:`<div class="art a-promo"><small>UNIFOOD</small><b>Prestige<br>-15 %</b><small>jusqu’au 30/11</small></div>`,
 promo2:`<div class="art a-promo" style="background:#F7C948;color:#5a1630"><small>UNIFOOD</small><b>Bonne fête<br>maman</b><small>-10 % sur le riz</small></div>`,
 vid:`<div class="art a-vid"></div>`,
 vid2:`<div class="art a-vid2"></div>`,
 cream:`<div class="art a-cream"><b>3 recettes<br>au riz parfumé</b><span class="bowl"></span></div>`,
 slide:`<div class="art a-slide"><b>Bilan commercial<br>octobre</b><i></i><div class="bars"><span style="height:40%"></span><span style="height:62%"></span><span style="height:55%"></span><span style="height:80%"></span><span style="height:92%"></span></div></div>`,
 story:`<div class="art a-story"><b>Nouveau<br>format</b><span class="sack"></span></div>`,
 cal:`<div class="art a-cal"><b>Posts de novembre</b><div class="d">${Array.from({length:28},(_,i)=>`<span class="${[1,4,8,11,15,18,22,25].includes(i)?'on':[6,13,20].includes(i)?'on2':''}"></span>`).join("")}</div></div>`,
 org:`<div class="art a-org"><b>Organigramme</b><span class="n" style="left:39%;top:30%"></span><span class="n" style="left:14%;top:58%"></span><span class="n" style="left:39%;top:58%"></span><span class="n" style="left:64%;top:58%"></span><span class="n" style="left:26%;top:80%"></span><span class="n" style="left:52%;top:80%"></span></div>`,
 li:`<div class="art a-li"><b>Unifood<br>recrute</b><small>Responsable logistique, Abidjan</small></div>`,
 pack:`<div class="art a-pack"></div>`,
 line:`<div class="art a-line"><b>Trésorerie, 13 semaines</b><svg viewBox="0 0 100 50" preserveAspectRatio="none"><polyline fill="none" stroke="#E60949" stroke-width="2.5" points="0,38 12,34 24,36 36,26 48,28 60,18 72,22 84,12 100,8"/><polyline fill="none" stroke="#C9C6D6" stroke-width="2" stroke-dasharray="3 3" points="0,30 100,30"/></svg></div>`,
 aff:`<div class="art a-aff"><b>Salon Agro<br>Abidjan</b></div>`,

};
ART.promo2=`<div class="art a-promo" style="background:#F7C948;color:#5a1630"><small>UNIFOOD</small><b>Bonne fête<br>maman</b><small>-10 % sur le riz</small></div>`;
ART.promo=ART.promo.replace('<span class="bag"></span>','');
// p = projet (dossier), k = médias | docs | liens
const L = [
 {k:"medias",p:"Offre Prestige",g:"Cette semaine",x:"fatima",a:"promo",t:"Post Offre Prestige",d:"Aujourd’hui",nw:1},
 {k:"medias",p:"Salon Agro",g:"Cette semaine",x:"koffi",a:"aff",t:"Affiche Salon Agro",d:"Aujourd’hui",busy:1},
 {k:"medias",p:"Coulisses de l’usine",g:"Cette semaine",x:"fatima",a:"vid",t:"Vidéo coulisses de l’usine",d:"Hier",v:"0:42",nw:1},
 {k:"medias",p:"Bilan octobre",g:"Cette semaine",x:"kouassi",a:"slide",t:"Bilan commercial octobre",d:"Hier",s:"14"},
 {k:"medias",p:"Recettes au riz",g:"Cette semaine",x:"fatima",a:"cream",t:"Carrousel 3 recettes",d:"Jeudi",s:"5"},
 {k:"medias",p:"Offre Prestige",g:"Cette semaine",x:"fatima",a:"cal",t:"Calendrier des posts",d:"Mercredi"},
 {k:"medias",p:"Offre Prestige",g:"Novembre",x:"fatima",a:"story",t:"Story nouveau format 5 kg",d:"8 nov."},
 {k:"medias",p:"Trésorerie",g:"Novembre",x:"mamadou",a:"line",t:"Trésorerie 13 semaines",d:"7 nov."},
 {k:"medias",p:"Recettes au riz",g:"Novembre",x:"fatima",a:"vid2",t:"Témoignage client",d:"6 nov.",v:"1:05"},
 {k:"medias",p:"Salon Agro",g:"Novembre",x:"koffi",a:"pack",t:"Maquette emballage",d:"5 nov."},
 {k:"medias",p:"Recrutement logistique",g:"Novembre",x:"adjoua",a:"li",t:"Annonce LinkedIn",d:"4 nov."},
 {k:"medias",p:"Comité de direction",g:"Novembre",x:"djeneba",a:"org",t:"Organigramme",d:"3 nov."},
 {k:"medias",p:"Prospection Lagune",g:"Octobre",x:"kouassi",a:"slide2",t:"Plan de prospection Lagune",d:"29 oct.",s:"9"},
 {k:"medias",p:"Fête des mères",g:"Octobre",x:"fatima",a:"promo2",t:"Post Fête des mères",d:"24 oct."},
 {k:"medias",p:"Fête des mères",g:"Octobre",x:"fatima",a:"cream",t:"Recette du dimanche",d:"22 oct."},
 {k:"docs",p:"Comité de direction",g:"Cette semaine",x:"djeneba",f:"pdf",t:"Rapport mensuel novembre",m:"PDF, 8 pages",d:"Aujourd’hui",nw:1},
 {k:"docs",p:"Offre Prestige",g:"Cette semaine",x:"fatima",f:"doc",t:"Brief de l’offre Prestige",m:"Word, 3 pages",d:"Hier"},
 {k:"docs",p:"Prospection Lagune",g:"Cette semaine",x:"kouassi",f:"doc",t:"Proposition commerciale Lagune Distribution",m:"Word, 6 pages",d:"Hier"},
 {k:"docs",p:"Trésorerie",g:"Cette semaine",x:"mamadou",f:"xls",t:"Prévisionnel de trésorerie T1",m:"Excel, 3 onglets",d:"Mercredi"},
 {k:"docs",p:"Offre Prestige",g:"Novembre",x:"fatima",f:"xls",t:"Résultats des posts d’octobre",m:"Excel, 2 onglets",d:"5 nov."},
 {k:"docs",p:"Recrutement logistique",g:"Novembre",x:"adjoua",f:"pdf",t:"Fiche de poste Responsable logistique",m:"PDF, 2 pages",d:"4 nov."},
 {k:"liens",p:"Bilan octobre",g:"Cette semaine",x:"kouassi",ic:"presentation",col:"#F4B400",t:"Bilan commercial octobre",m:"Google Slides",d:"Hier",nw:1},
 {k:"liens",p:"Offre Prestige",g:"Cette semaine",x:"fatima",dom:"canva.com",t:"Visuels Offre Prestige",m:"Canva",d:"Jeudi"},
 {k:"liens",p:"Trésorerie",g:"Novembre",x:"mamadou",ic:"sheet",col:"#1E8E3E",t:"Suivi des encaissements",m:"Google Sheets",d:"7 nov."},
 {k:"liens",p:"Recettes au riz",g:"Novembre",x:"fatima",dom:"instagram.com",t:"Carrousel publié sur Instagram",m:"Instagram",d:"6 nov."},
];
const q=new URLSearchParams(location.search);
const S={page:q.get("page")||"expert", who:q.get("who")||"fatima", mode:q.get("mode")||"galerie", tab:q.get("tab")||"medias", proj:q.get("proj")||null, nw:false};
if(S.page==="tous") S.who=q.get("who")||"all";
const scope = () => L.filter(v=>(S.who==="all"||v.x===S.who) && (!S.proj||v.p===S.proj) && (!S.nw||v.nw));
const groups = arr => { const o={}; arr.forEach(v=>(o[v.g]=o[v.g]||[]).push(v)); return Object.entries(o); };
function tile(v,mini){
  if(mini) return `<span class="t" style="display:block;width:100%;height:100%">${ART[v.a]}</span>`;
  return `<button class="t" aria-label="${v.t}" onclick="toast('${v.busy?X[v.x]+' y travaille encore':'Ouverture de « '+v.t.replace(/'/g,'’')+' »'}')">${ART[v.a]}${!mini&&(v.v||v.s)?'<span class="ov"></span>':''}
   ${!mini&&v.v?`<span class="play">${IC("play")}</span><span class="meta">${IC("video")}${v.v}</span>`:!mini&&v.s?`<span class="meta">${IC("gallery-horizontal-end")}${v.s}</span>`:""}
   ${!mini&&S.who==="all"?`<img class="by" src="${ph(v.x)}" alt="">`:""}${!mini&&v.nw?'<span class="nw"></span>':""}
   ${v.busy&&!mini?`<span class="busy"><span class="spin"></span>En préparation</span>`:""}</button>`;
}
function projects(){
  const o={}; L.filter(v=>S.who==="all"||v.x===S.who).forEach(v=>{(o[v.p]=o[v.p]||[]).push(v)});
  return Object.entries(o);
}
function docRow(v){return `<button class="row" onclick="toast('Aperçu : ${v.t.replace(/'/g,"’")}')"><span class="pg f-${v.f}"><i></i><i></i><i></i><i></i><i style="width:60%"></i><em>${{pdf:"PDF",doc:"DOCX",xls:"XLSX"}[v.f]}</em></span><span class="tx"><b>${v.t}</b><small>${S.who==="all"?`<img src="${ph(v.x)}" alt="">${X[v.x]}, `:""}${v.m}, ${v.d}</small></span>${v.nw?'<span style="width:10px;height:10px;border-radius:50%;background:var(--b)"></span>':''}</button>`}
function linkRow(v){return `<button class="row" onclick="toast('Ouverture du lien')"><span class="lk" ${v.ic?`style="background:${v.col};color:#fff"`:""}>${v.ic?IC(v.ic):`<img src="https://www.google.com/s2/favicons?domain=${v.dom}&sz=64" alt="">`}</span><span class="tx"><b>${v.t}</b><small>${S.who==="all"?`<img src="${ph(v.x)}" alt="">${X[v.x]}, `:""}${v.m}, ${v.d}</small></span><span style="color:var(--ink3)">${IC("external-link")}</span></button>`}
function render(){
  const sc=scope(); const N={medias:0,docs:0,liens:0}; sc.forEach(v=>N[v.k]++);
  let h="";
  if(S.page==="expert"){
    h+=`<div class="xh"><img src="${ph(S.who)}" alt=""><span><b>${X[S.who]}</b><small>${S.who}@unifood.yelema.ai</small></span></div>
     <div class="xt">${["Discussion","Livrables","Appels","E-mails","Routines"].map(t=>`<span class="${t==="Livrables"?"on":""}">${t}</span>`).join("")}</div>`;
  } else {
    h+=`<button class="back" onclick="toast('Retour à l’accueil')">${IC("chevron-left")}Accueil</button><div class="hd"><h1>Livrables</h1></div>`;
  }
  h+=`<div class="tb ${S.page}">${S.page==="tous"?`<div class="ddw" style="position:relative"><button class="dd" id="ddb">${S.who==="all"?`<span class="st">${["fatima","koffi","kouassi"].map(k=>`<img src="${ph(k)}" alt="">`).join("")}</span><span class="lb">Tous les Experts</span>`:`<span class="st"><img src="${ph(S.who)}" alt=""></span><span class="lb">${X[S.who]}</span>`}${IC("chevron-down")}</button>
      <div class="menu" id="menu"><button data-who="all">${IC("users")}Tous les Experts</button>${Object.keys(X).map(k=>`<button data-who="${k}"><img src="${ph(k)}" alt=""><span>${X[k]}<small>${JOB[k]}</small></span></button>`).join("")}</div></div>`:""}
    <span class="sf">${IC("search")}<b style="font-weight:400">Rechercher</b></span>
    <button class="sort">Plus récent ${IC("chevron-down")}</button>
    <span class="tg"><button aria-pressed="${S.mode==="galerie"}" data-mode="galerie" aria-label="Galerie">${IC("layout-grid")}</button><button aria-pressed="${S.mode==="liste"}" data-mode="liste" aria-label="Liste">${IC("list")}</button></span></div>`;
  if(S.proj){
    h+=`<div class="crumb"><button data-proj="">${IC("chevron-left")}Livrables</button><span style="color:var(--ink3)">${IC("chevron-right")}</span><b>${S.proj}</b></div>`;
  } else {
    const P=projects();
    h+=`<div class="ph2"><h2>Projets</h2><small>${P.length}</small></div><div class="pr">${P.map(([p,l])=>{const nw=l.filter(v=>v.nw).length;const m=l.filter(v=>v.k==="medias")[0];
      return `<button class="pc" data-proj="${p}"><span class="mo">${m?`<span class="t" style="pointer-events:none">${ART[m.a]}</span>`:`<span class="t" style="display:grid;place-items:center;color:var(--ink3)">${IC("folder")}</span>`}${nw?`<span class="nwb">${nw}</span>`:""}</span><b>${p}</b><small>${S.who==="all"?`<img src="${ph(l[0].x)}" alt="">`:""}${l.length} livrable${l.length>1?"s":""}</small></button>`}).join("")}</div>`;
  }
  h+=`<div class="bar2"><div class="seg" role="tablist" style="margin:0">${[["medias","Médias"],["docs","Docs"],["liens","Liens"]].map(([k,n])=>`<button data-tab="${k}" aria-selected="${S.tab===k}">${n}<small>${N[k]}</small></button>`).join("")}</div>
    <button class="chip" data-nw aria-pressed="${S.nw}">Nouveaux</button></div>`;
  const cur=sc.filter(v=>v.k===S.tab);
  if(!cur.length) h+=`<p style="text-align:center;color:var(--ink3);padding:50px 16px;font-size:14px">Rien ici pour l’instant.</p>`;
  else if(S.mode==="galerie"||S.tab!=="medias"){
    h+=groups(cur).map(([g,l])=>`<section class="grp"><h2>${g}</h2>${S.tab==="medias"?`<div class="grid">${l.map(v=>tile(v)).join("")}</div>`:`<div class="list lst">${l.map(S.tab==="docs"?docRow:linkRow).join("")}</div>`}</section>`).join("");
  } else {
    h+=`<div class="lst" style="margin-top:14px">${cur.map(v=>`<button class="lrow" onclick="toast('Ouverture')"><span class="th">${tile(v,1)}</span><span class="tx"><b>${v.t}</b><small>${S.proj?"":v.p+", "}${v.v?"Vidéo, "+v.v:v.s?v.s+" diapositives":"Image"}, ${v.d}</small></span>${v.nw?'<span style="width:10px;height:10px;border-radius:50%;background:var(--b)"></span>':''}</button>`).join("")}</div>`;
  }
  document.getElementById("app").innerHTML=h;
}
let tt; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",1800)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); const m=document.getElementById("menu");
  if(b&&b.id==="ddb"){m.classList.toggle("on");return}
  if(!b){m&&m.classList.remove("on");return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render()}
  else if(b.dataset.mode){S.mode=b.dataset.mode;render()}
  else if(b.dataset.proj!==undefined){S.proj=b.dataset.proj||null;render()}
  else if(b.hasAttribute("data-nw")){S.nw=!S.nw;render()}
  else if(b.dataset.who){S.who=b.dataset.who;S.proj=null;render()}
  else if(b.classList.contains("sort")) toast("Plus récent, A à Z");
});
render(); if(q.get("menu")) document.getElementById("menu").classList.add("on");
</script>
</body>
</html>
